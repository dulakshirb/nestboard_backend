services:
  - type: web
    name: nestboard-backend
    runtime: node
    plan: free
    buildCommand: npm install && npm run build && npx prisma generate
    startCommand: npx prisma migrate deploy && node dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://your-frontend.vercel.app
      - key: RATE_LIMIT
        value: "100"
      - key: UPLOAD_PROVIDER
        value: local
      - key: UPLOAD_LOCAL_DIR
        value: ./uploads
